body{

    color:#fff;

/* ================= LOGIN ================= */

#loginPage{

    display:flex;
    justify-content:center;

    padding:20px;
}

.login-box{
    width:min(92%,450px);

    border:2px solid #ff1b1b;
    border-radius:35px;
    background:rgba(3,5,15,.96);
    box-shadow:

.login-logo{

    margin:0 auto 25px;
    border:2px solid #ff2424;
    border-radius:25px;

}

.login-logo svg{

    stroke:currentColor;

}

.login-title{

.login-title p{

.login-group{

.login-group label{

}

.login-group input{

    padding:0 20px;
    background:#02050b;
    color:#fff;
    border:1px solid rgba(255,0,0,.45);
    border-radius:17px;
    font-size:16px;
    outline:none;
}

.login-group input:focus{

    box-shadow:0 0 15px rgba(255,0,0,.25);
}

.login-btn{

    height:60px;
    border:none;
    border-radius:35px;
    color:#fff;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;

.login-error{

    color:#ff5555;
    border:1px solid #ff3030;
    background:rgba(255,0,0,.08);

/* ================= ACCOUNT INFO ================= */

/* =====================================================
   LOGIN SYSTEM
===================================================== */

let currentUser = null;
let accountTimer = null;


function getAccountData(username){

    const data =
        localStorage.getItem(
            "badakAccount_" + username
        );

    return data ? JSON.parse(data) : null;
}


function saveAccountData(username,data){

    localStorage.setItem(
        "badakAccount_" + username,
        JSON.stringify(data)
    );

}


function login(){

    const username =
        document.getElementById("username")
        .value.trim();

    const password =
        document.getElementById("password")
        .value;

    const error =
        document.getElementById("loginError");


    if(!accounts[username]){

        error.innerHTML =
            "❌ Username tidak ditemukan.";

        error.style.display =
            "block";

        return;
    }


    if(accounts[username].password !== password){

        error.innerHTML =
            "❌ Password salah.";

        error.style.display =
            "block";

        return;
    }


    const account =
        accounts[username];


    let saved =
        getAccountData(username);


    /*
       Countdown mulai pada login pertama.
    */

    if(!saved){

        if(account.duration === null){

            saved = {
                unlimited:true,
                endTime:null
            };

        }else{

            saved = {

                unlimited:false,

                endTime:
                    Date.now() +
                    account.duration *
                    24 *
                    60 *
                    60 *
                    1000

            };

        }

        saveAccountData(
            username,
            saved
        );

    }


    /*
       Periksa masa berlaku.
    */

    if(
        !saved.unlimited &&
        Date.now() >= Number(saved.endTime)
    ){

        error.innerHTML =
            "⛔ AKUN SUDAH EXPIRED.<br>" +
            "Akses tidak tersedia lagi.";

        error.style.display =
            "block";

        return;
    }


    /* Login berhasil */

    currentUser =
        username;


    error.style.display =
        "none";


    document.getElementById("loginPage")
        .style.display = "none";


    document.getElementById("websitePage")
        .style.display = "block";


    document.getElementById("username")
        .value = "";

    document.getElementById("password")
        .value = "";


    showAccountInfo();

}


/* =====================================================
   ACCOUNT COUNTDOWN
===================================================== */

function showAccountInfo(){

    let old =
        document.getElementById(
            "accountInfo"
        );


    if(old){
        old.remove();
    }


    const info =
        document.createElement("div");


    info.id =
        "accountInfo";


    document.body.appendChild(info);


    updateAccountCountdown();


    clearInterval(accountTimer);


    accountTimer =
        setInterval(
            updateAccountCountdown,
            1000
        );

}


function updateAccountCountdown(){

    if(!currentUser){
        return;
    }


    const data =
        getAccountData(
            currentUser
        );


    const info =
        document.getElementById(
            "accountInfo"
        );


    if(!data || !info){
        return;
    }


    if(data.unlimited){

        info.innerHTML = `
            👤 ${escapeHTML(currentUser)}
            <br>
            <span style="color:#00ff55">
                ♾️ AKSES UNLIMITED
            </span>
        `;

        return;
    }


    const remaining =
        Number(data.endTime) -
        Date.now();


    if(remaining <= 0){

        clearInterval(accountTimer);


        info.innerHTML = `
            👤 ${escapeHTML(currentUser)}
            <br>
            <span style="color:#ff3333">
                ⛔ AKSES EXPIRED
            </span>
        `;


        setTimeout(function(){

            alert(
                "Masa akses akun " +
                currentUser +
                " telah habis."
            );


            logout();

        },300);


        return;
    }


    const days =
        Math.floor(
            remaining /
            (1000*60*60*24)
        );


    const hours =
        Math.floor(
            (remaining %
            (1000*60*60*24)) /
            (1000*60*60)
        );


    const minutes =
        Math.floor(
            (remaining %
            (1000*60*60)) /
            (1000*60)
        );


    const seconds =
        Math.floor(
            (remaining %
            (1000*60)) /
            1000
        );


    info.innerHTML = `
        👤 ${escapeHTML(currentUser)}
        <br>
        <span style="color:#00ff55">
            ⏱ Sisa Akses:
            ${days}H
            ${hours}J
            ${minutes}M
            ${seconds}D
        </span>
    `;

}

    clearInterval(accountTimer);

    currentUser = null;


    document.getElementById("websitePage")
        .style.display = "none";


    document.getElementById("loginPage")
        .style.display = "flex";


    const info =
        document.getElementById(
            "accountInfo"
        );


    if(info){
        info.remove();
    }

}

    switch(method){

        case "Badak":
            return 9*60*60*1000;

        case "Badak Medium":
            return 30*60*60*1000;

        case "Badak Hard":
            return 2*24*60*60*1000;

        case "Badak Extreme":
            return 24*24*60*60*1000;

        default:
            return 9*60*60*1000;

    }

}


/* =====================================================
   TAMBAH NOMOR
===================================================== */

function enterNumber(){

    const number =
        document.getElementById(
            "number"
        ).value.trim();


    const method =
        document.getElementById(
            "method"
        ).value;


    if(number === ""){

        alert(
            "Masukkan nomor terlebih dahulu."
        );

        return;
    }


    if(method === ""){

        alert(
            "Pilih metode terlebih dahulu."
        );

        return;
    }


    const status =
        Math.random() < 0.5
        ? "ONLINE"
        : "OFFLINE";


    const endTime =
        Date.now() +
        getDuration(method);


    numbers.push({

        id:
            Date.now() +
            Math.random(),

        number:number,

        method:method,

        status:status,

        endTime:endTime

    });


    saveData();


    document.getElementById(
        "success"
    ).style.display = "block";


    document.getElementById(
        "number"
    ).value = "";


    document.getElementById(
        "method"
    ).value = "";


    setTimeout(function(){

        document.getElementById(
            "success"
        ).style.display = "none";

    },3000);

}

/* =====================================================
   RENDER NOMOR
===================================================== */

function renderNumbers(){

    timers.forEach(
        clearInterval
    );


    timers = [];


    const list =
        document.getElementById(
            "numberList"
        );


    const total =
        document.getElementById(
            "totalNumber"
        );


    const now =
        Date.now();


    numbers =
        numbers.filter(
            item =>
                Number(item.endTime) > now
        );


    saveData();


    total.textContent =
        numbers.length;


    if(numbers.length === 0){

        list.innerHTML = `
            <div class="empty">
                Belum ada nomor yang dimasukkan.
            </div>
        `;

        return;
    }


    list.innerHTML = "";


    numbers.forEach(function(item){

        const statusClass =
            item.status === "ONLINE"
            ? "online"
            : "offline";


        const element =
            document.createElement("div");


        element.className =
            "number-item";


        element.innerHTML = `

            <div class="number">
                📱 ${escapeHTML(item.number)}
            </div>

            <div class="method">
                Method:
                ${escapeHTML(item.method)}
            </div>

            <div class="status ${statusClass}">
                ● ${item.status}
            </div>

            <div
                class="countdown"
                id="count-${item.id}">

                Menghitung...

            </div>

        `;


        list.appendChild(element);


        startCountdown(
            item.id,
            item.endTime
        );

    });

}


/* =====================================================
   COUNTDOWN NOMOR
===================================================== */

function startCountdown(
    id,
    endTime
){

    const element =
        document.getElementById(
            "count-" + id
        );


    if(!element){
        return;
    }


    let timer;


    function update(){

        const distance =
            Number(endTime) -
            Date.now();


        if(distance <= 0){

            clearInterval(timer);


            numbers =
                numbers.filter(
                    item =>
                        String(item.id) !==
                        String(id)
                );


            saveData();


            renderNumbers();


            return;
        }


        const days =
            Math.floor(
                distance /
                (1000*60*60*24)
            );


        const hours =
            Math.floor(
                (distance %
                (1000*60*60*24)) /
                (1000*60*60)
            );


        const minutes =
            Math.floor(
                (distance %
                (1000*60*60)) /
                (1000*60)
            );


        const seconds =
            Math.floor(
                (distance %
                (1000*60)) /
                1000
            );


        if(days > 0){

            element.textContent =
                `⏱ ${days} Hari ` +
                `${hours} Jam ` +
                `${minutes} Menit ` +
                `${seconds} Detik`;

        }else{

            element.textContent =
                `⏱ ${hours} Jam ` +
                `${minutes} Menit ` +
                `${seconds} Detik`;

        }

    }


    update();


    timer =
        setInterval(
            update,
            1000
        );


    timers.push(timer);

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(text){

    const div =
        document.createElement("div");

    div.textContent =
        String(text);

    return div.innerHTML;

}
